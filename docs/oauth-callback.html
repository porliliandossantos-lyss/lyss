<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<title>Lyss — TikTok Authorization</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; color: #1b1230; }
  code { background: #f0eefa; padding: 12px; display: block; border-radius: 8px; word-break: break-all; font-size: 15px; margin: 16px 0; }
  .error { color: #b00020; }
</style>
</head>
<body>
  <h1>Authorization received</h1>
  <p id="msg">Reading the code...</p>
  <code id="code" style="display:none"></code>
  <p id="hint" style="display:none">Copy the code above and paste it back into the terminal where <code style="display:inline">npm run tiktok:auth</code> is waiting.</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const msg = document.getElementById("msg");
    const codeEl = document.getElementById("code");
    const hint = document.getElementById("hint");
    if (code) {
      msg.textContent = "All set. Authorization code:";
      codeEl.textContent = code;
      codeEl.style.display = "block";
      hint.style.display = "block";
    } else if (error) {
      msg.textContent = "TikTok denied the authorization: " + error;
      msg.className = "error";
    } else {
      msg.textContent = "No code found in the URL.";
      msg.className = "error";
    }
  </script>
</body>
</html>
